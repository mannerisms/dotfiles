# === Shell & Terminal ===
set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0
set -g focus-events on

# === Prefix ===
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# === General ===
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi
set-option -g allow-rename off
setw -g aggressive-resize on

# === Key Bindings ===

# Splits
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Kill pane without confirmation
bind x kill-pane

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Synchronize panes toggle
bind e set -g synchronize-panes

# === Vim-Tmux Navigator (smart pane switching) ===
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Window navigation
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Pane resize
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# === Vi Copy Mode ===
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# === Silence ===
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# === Status Bar ===
set -g status-interval 5
set -g status-justify centre

set -g status-style fg=colour240,bg=colour233

set -g status-left-length 40
set -g status-left "#[fg=colour232,bg=colour24,bold] #S #[fg=colour24,bg=colour240,nobold]#[fg=colour233,bg=colour240] #(whoami) #[fg=colour240,bg=colour235]#[fg=colour240,bg=colour235] #I:#P #[fg=colour235,bg=colour233,nobold]"

set -g status-right-length 150
set -g status-right "#[fg=colour235,bg=colour233]#[fg=colour240,bg=colour235] %H:%M #[fg=colour240,bg=colour235]#[fg=colour233,bg=colour240] %d-%b-%y #[fg=colour245,bg=colour240]#[fg=colour232,bg=colour245,bold] #H "

set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-current-style bg=colour24,fg=colour232
set -g window-status-activity-style bg=colour31,fg=colour233
set -g window-status-separator ""

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour24

# Messages
set -g message-style bg=colour24,fg=black
set -g message-command-style bg=colour233,fg=black

# Clock
set -g clock-mode-colour colour24
set -g clock-mode-style 24
